# The access log records the path without the query string: addresses must not carry credentials into logs,
# and the event-stream ticket is in the query (it expires in 30 seconds, but the log does not need it at all).
log_format noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log noquery;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;          # Server-Sent Events must not be buffered
    proxy_read_timeout 1h;
    client_max_body_size 8m;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location /docs/ {
    try_files $uri $uri/ /docs/index.html;
  }

  location / {
    try_files $uri /index.html;
  }
}
