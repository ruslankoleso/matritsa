openapi: 3.0.3
info:
  title: Матрица — умный кредитный кабинет
  version: 1.0.0
  description: |
    API кредитного конвейера для малого бизнеса (прототип команды МАТРИЦА РУСИ).
    Все суммы — в копейках (целые числа). Ставки — в базисных пунктах (1650 = 16,5 %).
    Внешние системы (БКИ, ЕГРЮЛ), подписание и выдача смоделированы.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: reference
  - name: client
  - name: staff
  - name: support
  - name: realtime

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход по логину и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Токены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Обновить токены
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Новые токены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Регистрация нового клиента
      description: "Создаёт аккаунт предпринимателя и привязывает его к компании по ИНН. Данные компании подтягиваются из реестра (смоделированного). Сотрудников банка через регистрацию завести нельзя. Одна компания — один аккаунт."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Аккаунт создан, пользователь сразу вошёл
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/company:
    get:
      tags: [auth]
      operationId: lookupCompanyForSignup
      summary: Найти компанию по ИНН при регистрации
      security: []
      parameters:
        - { name: inn, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Компания из реестра, которую ещё не зарегистрировали
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyLookup' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/registration-examples:
    get:
      tags: [auth]
      operationId: registrationExamples
      summary: Тестовые ИНН для регистрации
      description: "Подсказка для демонстрации: какие ИНН какой тип компании дадут (все данные синтетические)."
      security: []
      responses:
        '200':
          description: Примеры
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RegistrationExample' }
  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Текущий пользователь
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }

  /products:
    get:
      tags: [reference]
      operationId: listProducts
      summary: Каталог кредитных продуктов (публичный, для калькулятора)
      security: []
      responses:
        '200':
          description: Продукты
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
  /company/lookup:
    get:
      tags: [reference]
      operationId: lookupCompany
      summary: Найти компанию по ИНН в (смоделированном) ЕГРЮЛ
      parameters:
        - { name: inn, in: query, required: true, schema: { type: string, example: '7701234501' } }
      responses:
        '200':
          description: Сведения о компании
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyLookup' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /assistant/recommend:
    post:
      tags: [reference]
      operationId: recommendProduct
      summary: Подобрать продукт по описанию потребности (ИИ либо правила)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendRequest' }
      responses:
        '200':
          description: Рекомендация
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recommendation' }
        '422': { $ref: '#/components/responses/Error' }

  /assistant/chat:
    get:
      tags: [reference]
      operationId: getChat
      summary: Мой разговор с помощником
      description: "Один разговор на клиента: сообщения клиента, помощника и сотрудника поддержки, если он подключался. Последние 100 сообщений."
      responses:
        '200':
          description: Разговор
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatThread' }
    post:
      tags: [reference]
      operationId: sendChatMessage
      summary: Написать в чат
      description: "Помощник отвечает только по кредитам для бизнеса и работе кабинета; вопросы не по теме отклоняются в коде до обращения к модели. Если клиент просит сотрудника, разговор встаёт в очередь поддержки, помощник продолжает отвечать до подключения сотрудника; когда сотрудник подключился, помощник молчит. Ограничения: до 500 символов, не более 30 сообщений за 10 минут."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: Разговор с ответом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatThread' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /assistant/chat/operator:
    post:
      tags: [reference]
      operationId: requestChatOperator
      summary: Позвать сотрудника поддержки
      responses:
        '200':
          description: Разговор в очереди поддержки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatThread' }
    delete:
      tags: [reference]
      operationId: cancelChatOperator
      summary: Вернуться к помощнику
      description: "Отменяет запрос или завершает разговор с сотрудником; дальше отвечает помощник."
      responses:
        '200':
          description: Разговор с помощником
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatThread' }

  /applications:
    get:
      tags: [client]
      operationId: listApplications
      summary: Мои заявки
      responses:
        '200':
          description: Заявки
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApplicationSummary' }
    post:
      tags: [client]
      operationId: createApplication
      summary: Создать черновик заявки
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
      responses:
        '201':
          description: Черновик
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '422': { $ref: '#/components/responses/Error' }
  /applications/{id}:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    get:
      tags: [client]
      operationId: getApplication
      summary: Заявка целиком
      responses:
        '200':
          description: Заявка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [client]
      operationId: updateApplication
      summary: Изменить черновик (автосохранение шагов мастера)
      description: |
        Черновик и заявку, которую система вернула на дополнение, можно менять; каждое изменение увеличивает версию,
        а после отправки записывается в журнал. Если уточнение запросил сотрудник, условия уже оценены: ответ 409 `terms_locked`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
      responses:
        '200':
          description: Заявка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /applications/{id}/submit:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string, minLength: 8, maxLength: 80 }
    post:
      tags: [client]
      operationId: submitApplication
      summary: Подать заявку (повтор с тем же ключом возвращает тот же результат)
      responses:
        '200':
          description: Заявка принята в работу
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /applications/{id}/documents:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [client]
      operationId: uploadDocument
      summary: Загрузить документ (PDF, PNG, JPEG до 5 МБ)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { type: string, example: bank_statement }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Документ загружен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /applications/{id}/documents/{documentId}:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
      - { $ref: '#/components/parameters/DocumentId' }
    get:
      tags: [client]
      operationId: downloadDocument
      summary: Файл документа своей заявки
      responses:
        '200':
          description: Файл в исходном формате
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Error' }
  /applications/{id}/respond:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [client]
      operationId: respondToInfoRequest
      summary: Ответить на запрос уточнения и вернуть заявку в обработку
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InfoResponse' }
      responses:
        '200':
          description: Заявка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /applications/{id}/offer/accept:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [client]
      operationId: acceptOffer
      summary: Принять предложение, подписать (демо) — деньги выдаются условно
      responses:
        '200':
          description: Заявка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /applications/{id}/offer/decline:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [client]
      operationId: declineOffer
      summary: Отказаться от предложения
      responses:
        '200':
          description: Заявка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /applications/{id}/cancel:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [client]
      operationId: cancelApplication
      summary: Отозвать заявку
      responses:
        '200':
          description: Заявка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /applications/{id}/timeline:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    get:
      tags: [client]
      operationId: getTimeline
      summary: История заявки человеческим языком
      responses:
        '200':
          description: События
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TimelineEntry' }
        '404': { $ref: '#/components/responses/Error' }
  /feed:
    get:
      tags: [client]
      operationId: getFeed
      summary: Персональная лента предложений и подсказок
      responses:
        '200':
          description: Карточки ленты
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FeedCard' }
  /notifications:
    get:
      tags: [client]
      operationId: listNotifications
      summary: Уведомления внутри кабинета
      responses:
        '200':
          description: Уведомления
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
  /notifications/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [client]
      operationId: markNotificationRead
      summary: Отметить уведомление прочитанным
      responses:
        '204': { description: Готово }

  /events/ticket:
    post:
      tags: [realtime]
      operationId: issueEventsTicket
      summary: Билет на открытие потока событий (действует 30 секунд)
      description: >-
        EventSource не умеет отправлять заголовки, поэтому учётные данные потока идут в адресе и попадают в журналы прокси.
        Вместо токена доступа там передаётся билет: он открывает только поток событий и истекает через 30 секунд.
      responses:
        '200':
          description: Билет
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expiresIn]
                properties:
                  ticket: { type: string }
                  expiresIn: { type: integer, description: Секунд до истечения }
        '401': { $ref: '#/components/responses/Error' }
  /events:
    get:
      tags: [realtime]
      operationId: streamEvents
      summary: Поток событий (Server-Sent Events) по билету из POST /events/ticket
      parameters:
        - { name: ticket, in: query, required: false, schema: { type: string }, description: 'Билет из POST /events/ticket; без него 401' }
      responses:
        '200':
          description: text/event-stream; события status, notification, queue
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  /staff/queue:
    get:
      tags: [staff]
      operationId: getQueue
      summary: Очередь заявок (сначала ожидающие решения сотрудника)
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: Поиск по названию или ИНН }
      responses:
        '200':
          description: Очередь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queue' }
        '403': { $ref: '#/components/responses/Error' }
  /staff/metrics:
    get:
      tags: [staff]
      operationId: getProcessMetrics
      summary: Показатели кредитного процесса по журналу заявок
      description: Доля автоматических решений, время до решения по режимам, доля возвратов на уточнение, доля принятых предложений.
      responses:
        '200':
          description: Показатели
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessMetrics' }
  /staff/applications/{id}/documents/{documentId}:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
      - { $ref: '#/components/parameters/DocumentId' }
    get:
      tags: [staff]
      operationId: downloadStaffDocument
      summary: Файл документа заявки для проверки сотрудником
      responses:
        '200':
          description: Файл в исходном формате
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Error' }
  /staff/applications/{id}:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    get:
      tags: [staff]
      operationId: getStaffApplication
      summary: Карточка заявки для сотрудника
      responses:
        '200':
          description: Карточка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffApplication' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /staff/applications/{id}/claim:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [staff]
      operationId: claimApplication
      summary: Взять заявку в работу
      description: Только заявку в статусе ANALYST_REVIEW; иначе 409. Взятую в работу заявку решает только назначенный сотрудник, коллега может забрать её себе этим же запросом.
      responses:
        '200':
          description: Карточка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffApplication' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /staff/applications/{id}/decision:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [staff]
      operationId: makeDecision
      summary: Принять решение по заявке
      description: |
        Встречное предложение не больше запрошенной суммы, ставка не ниже базовой ставки продукта (иначе 422).
        Заявку, взятую в работу другим сотрудником, решить нельзя: 409 `assigned_to_other`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Карточка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffApplication' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /staff/applications/{id}/purpose-check:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [staff]
      operationId: checkPurpose
      summary: "Оценка сотрудника по цели и сумме: подтверждена, требует уточнения или не подтверждена"
      description: "Только заявка в статусе ANALYST_REVIEW. Вердикт заменяет автоматическую оценку критерия, баллы, класс и рекомендация пересчитываются, версия заявки растёт. Заявку, взятую в работу другим сотрудником, оценить нельзя (409)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurposeCheckRequest' }
      responses:
        '200':
          description: Карточка после пересчёта
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffApplication' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /staff/applications/{id}/explanation:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    get:
      tags: [staff]
      operationId: getExplanation
      summary: Пояснение решения простым языком (ИИ либо шаблон)
      parameters:
        - { name: audience, in: query, schema: { type: string, enum: [staff, client], default: staff } }
      responses:
        '200':
          description: Пояснение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Explanation' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /support/chats:
    get:
      tags: [support]
      operationId: listSupportChats
      summary: Обращения, которым нужен человек
      description: "Сначала ожидающие сотрудника, самые давние сверху; затем разговоры в работе."
      responses:
        '200':
          description: Обращения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportChatList' }
        '403': { $ref: '#/components/responses/Error' }
  /support/chats/{id}:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    get:
      tags: [support]
      operationId: getSupportChat
      summary: Разговор с клиентом и сведения для ответа
      responses:
        '200':
          description: Разговор
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportChat' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /support/chats/{id}/join:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [support]
      operationId: joinSupportChat
      summary: Подключиться к разговору
      responses:
        '200':
          description: Разговор
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportChat' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /support/chats/{id}/messages:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [support]
      operationId: sendSupportMessage
      summary: Ответить клиенту
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportMessageRequest' }
      responses:
        '200':
          description: Разговор
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportChat' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /support/chats/{id}/close:
    parameters:
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [support]
      operationId: closeSupportChat
      summary: Завершить разговор и вернуть клиента помощнику
      responses:
        '200':
          description: Разговор
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportChat' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: validation_failed }
        message: { type: string, example: Проверьте введённые данные }
        fields:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, example: client1 }
        password: { type: string, example: demo1234 }
    RegisterRequest:
      type: object
      required: [fullName, login, password, inn, consent]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 100, example: Иванов Иван Иванович }
        login: { type: string, minLength: 3, maxLength: 32, description: "Латинские буквы, цифры, точка, дефис и подчёркивание", example: ivanov }
        password: { type: string, minLength: 8, maxLength: 72 }
        inn: { type: string, example: "7700000016" }
        consent: { type: boolean, description: "Согласие на обработку данных; без него регистрация невозможна" }
    RegistrationExample:
      type: object
      required: [inn, name, note]
      properties:
        inn: { type: string }
        name: { type: string }
        note: { type: string }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, role, fullName]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        role: { type: string, enum: [client, staff, support] }
        fullName: { type: string }
    Me:
      type: object
      required: [id, login, role, fullName]
      properties:
        id: { type: string, format: uuid }
        login: { type: string }
        role: { type: string, enum: [client, staff, support] }
        fullName: { type: string }
        company: { $ref: '#/components/schemas/Company' }
        consentedAt: { type: string, format: date-time, description: "Когда человек согласился на обработку данных при регистрации; у демонстрационных аккаунтов поля нет" }

    DocRequirement:
      type: object
      required: [kind, title, why, required]
      properties:
        kind: { type: string }
        title: { type: string }
        why: { type: string }
        required: { type: boolean }
    Product:
      type: object
      required: [id, title, description, hint, minAmount, maxAmount, minTerm, maxTerm, baseRateBp, autoApproveLimit, documents]
      properties:
        id: { type: string, enum: [working_capital, equipment, overdraft, express] }
        title: { type: string }
        description: { type: string }
        hint: { type: string }
        minAmount: { type: integer, format: int64 }
        maxAmount: { type: integer, format: int64 }
        minTerm: { type: integer }
        maxTerm: { type: integer }
        baseRateBp: { type: integer }
        autoApproveLimit: { type: integer, format: int64 }
        documents:
          type: array
          items: { $ref: '#/components/schemas/DocRequirement' }
    Company:
      type: object
      required: [id, inn, name, kind, registeredAt, okved, director, address]
      properties:
        id: { type: string, format: uuid }
        inn: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ooo, ip] }
        registeredAt: { type: string, format: date }
        okved: { type: string }
        director: { type: string }
        address: { type: string }
    CompanyLookup:
      type: object
      required: [inn, name, kind, status, registeredAt, okved, director, address]
      properties:
        inn: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ooo, ip] }
        status: { type: string, example: active }
        registeredAt: { type: string, format: date }
        okved: { type: string }
        director: { type: string }
        address: { type: string }
    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, maxLength: 500 }
    SupportMessageRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, maxLength: 1000 }
    ChatMessage:
      type: object
      required: [id, author, text, offTopic, at]
      properties:
        id: { type: integer, format: int64 }
        author: { type: string, enum: [client, assistant, agent, system] }
        text: { type: string }
        source: { type: string, enum: [ai, rules], description: "Только у помощника. ai: ответила открытая модель; rules: ответ по справочнику" }
        offTopic: { type: boolean, description: "Вопрос не по теме, помощник вежливо отказался" }
        agentName: { type: string, description: "Имя сотрудника поддержки, только у его сообщений" }
        at: { type: string, format: date-time }
    ChatThread:
      type: object
      required: [id, status, messages]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [bot, waiting, live], description: "bot: отвечает помощник; waiting: клиент ждёт сотрудника, помощник продолжает отвечать; live: пишет сотрудник" }
        agentName: { type: string, description: "Кто из сотрудников подключён (имя и должность)" }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
    SupportChatItem:
      type: object
      required: [id, status, clientName, companyName, lastText, waitingMinutes, mine]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [waiting, live] }
        clientName: { type: string }
        companyName: { type: string }
        lastText: { type: string, description: "Последнее сообщение клиента или сотрудника" }
        waitingMinutes: { type: integer, description: "Сколько клиент ждёт сотрудника" }
        agentName: { type: string }
        mine: { type: boolean, description: "Разговор ведёт текущий сотрудник" }
    SupportChatList:
      type: object
      required: [items, waiting, live]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SupportChatItem' }
        waiting: { type: integer }
        live: { type: integer }
    SupportApplicationFact:
      type: object
      required: [productTitle, amount, termMonths, statusLabel]
      properties:
        productTitle: { type: string }
        amount: { type: integer, format: int64 }
        termMonths: { type: integer }
        statusLabel: { type: string, description: "Статус так, как его видит клиент" }
    SupportChat:
      type: object
      required: [thread, clientName, companyName, applications, mine]
      properties:
        thread: { $ref: '#/components/schemas/ChatThread' }
        clientName: { type: string }
        companyName: { type: string }
        inn: { type: string }
        mine: { type: boolean }
        applications:
          type: array
          description: Заявки клиента со статусами, без оценки и решений
          items: { $ref: '#/components/schemas/SupportApplicationFact' }
    RecommendRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 1000, example: Нужно купить станок для мастерской }
    Recommendation:
      type: object
      required: [productId, rationale, source]
      properties:
        productId: { type: string }
        amount: { type: integer, format: int64 }
        termMonths: { type: integer }
        rationale: { type: string }
        source: { type: string, enum: [ai, rules] }

    ApplicationInput:
      type: object
      properties:
        productId: { type: string }
        amount: { type: integer, format: int64 }
        termMonths: { type: integer }
        purpose: { type: string, maxLength: 500 }
        fields:
          type: object
          description: "Ответы мастера заявки. Обеспечение: collateralKind (none, real_estate, equipment, transport, goods, guarantee) и collateralValue (стоимость залога в рублях). Сумма в подтверждающем документе: purposeDocAmount (рублей)"
          additionalProperties: { type: string }
    InfoResponse:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 1000 }
        version: { type: integer }
    Document:
      type: object
      required: [id, kind, filename, size, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        filename: { type: string }
        size: { type: integer, format: int64 }
        uploadedAt: { type: string, format: date-time }
    InfoRequest:
      type: object
      required: [text, requestedBy, at]
      properties:
        text: { type: string }
        items:
          type: array
          items: { type: string }
        requestedBy: { type: string, enum: [system, staff] }
        at: { type: string, format: date-time }
    Offer:
      type: object
      required: [amount, termMonths, rateBp, monthlyPayment, source, expiresAt]
      properties:
        amount: { type: integer, format: int64 }
        termMonths: { type: integer }
        rateBp: { type: integer }
        monthlyPayment: { type: integer, format: int64 }
        source: { type: string, enum: [auto, analyst, recommended] }
        expiresAt: { type: string, format: date-time }
        changes:
          type: array
          description: Что изменилось относительно заявки (для встречного предложения)
          items: { type: string }
    Rejection:
      type: object
      required: [reasons, by, advice, canReapply]
      properties:
        reasons:
          type: array
          items: { type: string }
        comment: { type: string }
        advice:
          type: string
          description: Что клиент может сделать дальше; зависит от причины отказа
        canReapply:
          type: boolean
          description: "Имеет ли смысл новая заявка сейчас: при жёстком стопе (компания не действует, банкротство) — нет"
        by:
          type: string
          enum: [system, staff]
          description: "Кто принял решение: правила системы (автоматический отказ) или сотрудник банка"
    ApplicationSummary:
      type: object
      required: [id, productId, productTitle, amount, termMonths, status, statusMessage, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string }
        productTitle: { type: string }
        amount: { type: integer, format: int64 }
        termMonths: { type: integer }
        status: { $ref: '#/components/schemas/Status' }
        statusMessage: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Application:
      allOf:
        - $ref: '#/components/schemas/ApplicationSummary'
        - type: object
          required: [version, purpose, allowedActions, missingItems, company, documents, fields]
          properties:
            version: { type: integer }
            purpose: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
            allowedActions:
              type: array
              description: Что клиент может сделать сейчас
              items: { type: string, enum: [edit, submit, upload, respond, accept, decline, cancel] }
            missingItems:
              type: array
              items: { type: string }
            infoRequest: { $ref: '#/components/schemas/InfoRequest' }
            offer: { $ref: '#/components/schemas/Offer' }
            rejection: { $ref: '#/components/schemas/Rejection' }
            company: { $ref: '#/components/schemas/Company' }
            documents:
              type: array
              items: { $ref: '#/components/schemas/Document' }
    Status:
      type: string
      enum: [DRAFT, SUBMITTED, INTAKE_CHECK, NEEDS_INFO, ENRICHMENT, SCORING, ANALYST_REVIEW, OFFER_MADE, REJECTED, SIGNING, DISBURSED, DECLINED_BY_CLIENT, EXPIRED, CANCELLED]
    TimelineEntry:
      type: object
      required: [at, actor, event, fromStatus, toStatus, message]
      properties:
        at: { type: string, format: date-time }
        actor: { type: string, description: 'system | client | staff' }
        event: { type: string }
        fromStatus: { type: string }
        toStatus: { type: string }
        comment: { type: string }
        message: { type: string }
    FeedCard:
      type: object
      required: [id, kind, title, body, priority]
      properties:
        id: { type: string }
        kind: { type: string, enum: [product, action, status, tip, upsell] }
        title: { type: string }
        body: { type: string }
        priority: { type: integer }
        productId: { type: string }
        applicationId: { type: string }
        ctaLabel: { type: string }
        ctaHref: { type: string }
    Notification:
      type: object
      required: [id, text, read, createdAt]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        text: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

    Factor:
      type: object
      required: [key, title, points, max, note]
      properties:
        key: { type: string }
        title: { type: string }
        points: { type: integer }
        max: { type: integer }
        note: { type: string }
        noData: { type: boolean, description: "По критерию нет данных: баллов нет, но заёмщик не признан плохим по нему" }
    ScoringResult:
      type: object
      required: [score, grade, factors, hardStops, maxAffordableAmount, debtLoad]
      properties:
        score: { type: integer }
        grade: { type: string, enum: [A, B, C, D], description: "A 80–100, B 50–79, C 30–49, D менее 30 или стоп-фактор" }
        qualityCategory: { type: string, description: "Категория качества ссуды по Положению 590-П, соответствующая классу" }
        reserveRange: { type: string, description: "Диапазон резерва на возможные потери по этой категории" }
        riskLabel: { type: string, description: "Уровень риска словами: низкий, умеренный, высокий, критический" }
        rateRiskFreeBp: { type: integer, description: "Безрисковая ставка в ставке по заявке, базисные пункты (ставка = безрисковая + PD x LGD + операционные расходы)" }
        rateRiskBp: { type: integer, description: "Премия за риск PD x LGD, базисные пункты" }
        rateOperatingBp: { type: integer, description: "Операционные расходы по продукту, базисные пункты" }
        debtEbitda: { type: number, description: "Долг / EBITDA с учётом лизинга и запрошенной суммы" }
        factors:
          type: array
          items: { $ref: '#/components/schemas/Factor' }
        hardStops:
          type: array
          items: { type: string }
        maxAffordableAmount: { type: integer, format: int64 }
        debtLoad: { type: number }
        payment: { type: integer, format: int64, description: Ежемесячный платёж по запрошенной сумме (по базовой ставке) }
        repaidTotal: { type: integer, format: int64, description: "Сумма кредитов, которые заёмщик уже погасил полностью" }
        repaidCoverage: { type: number, format: float, description: "Какую долю запрошенной суммы покрывает погашенное: погашено / запрошено" }
        minRepaidCoverage: { type: number, format: float, description: "Минимальное покрытие для автоматического решения" }
        maxLoad: { type: number, format: float, description: "Предельная доля платежей в выручке" }
        dscr: { type: number, format: float, description: "Покрытие всех платежей (действующих и по заявке) денежным потоком" }
        minDscr: { type: number, format: float, description: "Минимально допустимое покрытие" }
        monthlyCashFlow: { type: integer, format: int64, description: "Оценка месячного денежного потока до платежей по долгам, копейки" }
        maxAmountByLoad: { type: integer, format: int64, description: "Предельная сумма по доле платежей в выручке" }
        maxAmountByDscr: { type: integer, format: int64, description: "Предельная сумма по покрытию денежным потоком" }
        pd: { type: number, description: Вероятность дефолта за год для класса заёмщика }
        cumulativePd: { type: number, description: Вероятность дефолта за срок кредита }
        lgd: { type: number, description: Доля потерь при дефолте (зависит от продукта) }
        ead: { type: integer, format: int64, description: Сумма под риском на момент дефолта }
        expectedLoss: { type: integer, format: int64, description: 'Ожидаемые потери EL = накопленный PD × LGD × EAD' }
        expectedLossRate: { type: number, description: EL / EAD }
        riskPremiumBp: { type: integer, description: 'Надбавка к ставке за риск, базисные пункты' }
    BKIReport:
      type: object
      required: [hasHistory, activeLoans, totalDebt, maxOverdueDays, score]
      properties:
        hasHistory: { type: boolean }
        activeLoans: { type: integer }
        totalDebt: { type: integer, format: int64 }
        maxOverdueDays: { type: integer }
        score: { type: integer }
        closedLoans: { type: integer, description: "Число кредитов, погашенных полностью" }
        totalRepaid: { type: integer, format: int64, description: "Сумма погашенных кредитов в копейках" }
        restructured: { type: boolean, description: "Действующий кредит был реструктурирован" }
        leasingDebt: { type: integer, format: int64, description: "Остаток по договорам лизинга в копейках" }
        overdues:
          type: array
          description: "Просрочки за 36 месяцев"
          items: { $ref: '#/components/schemas/Overdue' }
    EGRULRecord:
      type: object
      required: [inn, name, status]
      properties:
        inn: { type: string }
        name: { type: string }
        status: { type: string }
        registeredAt: { type: string, format: date-time }
        okved: { type: string }
        director: { type: string }
        address: { type: string }
        bankrupt: { type: boolean }
        directorDisqualified: { type: boolean, description: "Руководитель в реестре дисквалифицированных лиц (смоделировано)" }
        unreliableData: { type: boolean, description: "В реестре отмечена недостоверность сведений о компании (смоделировано)" }
        cases:
          type: array
          description: "Судебные дела компании и руководителя (смоделированы)"
          items: { $ref: '#/components/schemas/CourtCase' }
        finance: { $ref: '#/components/schemas/FinanceData' }
        statement: { $ref: '#/components/schemas/StatementData' }
    CourtCase:
      type: object
      required: [defendant, amount, yearsAgo]
      properties:
        defendant: { type: boolean, description: "Компания или руководитель ответчик" }
        amount: { type: integer, format: int64, description: "Сумма иска в копейках" }
        yearsAgo: { type: number, description: "Сколько лет назад" }
    Overdue:
      type: object
      required: [days, monthsAgo]
      properties:
        days: { type: integer }
        monthsAgo: { type: integer }
    PurposeCheckRequest:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string, enum: [confirmed, clarify, not_confirmed] }
        comment: { type: string, maxLength: 500 }
    FinanceData:
      type: object
      description: "Данные бухгалтерской отчётности (смоделированы). У ИП отчётности часто нет"
      required: [grossMargin, currentRatio]
      properties:
        grossMargin: { type: number, description: "Валовая прибыль / выручка" }
        currentRatio: { type: number, description: "Коэффициент текущей ликвидности" }
    StatementData:
      type: object
      description: "Показатели банковской выписки (смоделированы): по ним считаются аномалии по таблице аналитика"
      required: [noiMargin, circularShare, circularMonths, cashShare, taxBurden, dubiousPayments, dubiousShare, balanceCover]
      properties:
        noiMargin: { type: number, description: "(Поступления минус операционные списания) / поступления; долговые платежи не вычитаются" }
        circularShare: { type: number, description: "Доля оборота: круговые переводы и транзит" }
        circularMonths: { type: integer, description: "В скольких месяцах из последних 12 они были" }
        cashShare: { type: number, description: "Доля снятия наличных в обороте" }
        taxBurden: { type: number, description: "Налоги к обороту" }
        dubiousPayments: { type: integer, description: "Платежи сомнительным контрагентам за 12 месяцев" }
        dubiousShare: { type: number, description: "Их доля в обороте" }
        balanceCover: { type: number, description: "Средний остаток на счёте в месяцах среднемесячных расходов" }
    Enrichment:
      type: object
      required: [attempts]
      properties:
        egrul: { $ref: '#/components/schemas/EGRULRecord' }
        bki: { $ref: '#/components/schemas/BKIReport' }
        attempts: { type: integer }
        lastError: { type: string }
    ProcessMetrics:
      type: object
      required: [submitted, decided, decidedAuto, autoShare, medianAutoSeconds, medianAnalystSeconds, askedInfo, infoShare, offered, accepted, declined, expired, acceptanceShare, waitingAnalyst]
      properties:
        submitted: { type: integer, description: Отправлено заявок }
        decided: { type: integer, description: Принято решений (первое решение по заявке) }
        decidedAuto: { type: integer, description: Из них правилами системы без сотрудника }
        autoShare: { type: number, format: double, description: "Доля автоматических решений, от 0 до 1" }
        medianAutoSeconds: { type: number, format: double, description: Медиана времени от отправки до автоматического решения }
        medianAnalystSeconds: { type: number, format: double, description: Медиана времени от отправки до решения сотрудника }
        askedInfo: { type: integer, description: "Заявок, возвращённых на уточнение" }
        infoShare: { type: number, format: double, description: "Доля возвратов на уточнение от отправленных, от 0 до 1" }
        offered: { type: integer, description: Решений с предложением }
        accepted: { type: integer }
        declined: { type: integer }
        expired: { type: integer }
        acceptanceShare: { type: number, format: double, description: "Доля принятых среди предложений, по которым клиент уже ответил или срок истёк, от 0 до 1" }
        waitingAnalyst: { type: integer, description: Сейчас ждут решения сотрудника }
    QueueItem:
      type: object
      required: [id, companyName, inn, productTitle, amount, termMonths, status, updatedAt, waitingMinutes, manualCheck, automatic]
      properties:
        id: { type: string, format: uuid }
        companyName: { type: string }
        inn: { type: string }
        productTitle: { type: string }
        amount: { type: integer, format: int64 }
        termMonths: { type: integer }
        status: { $ref: '#/components/schemas/Status' }
        grade: { type: string }
        score: { type: integer }
        updatedAt: { type: string, format: date-time }
        waitingMinutes: { type: integer }
        manualCheck: { type: boolean }
        automatic: { type: boolean, description: "Решение принято правилами системы без сотрудника (автоотказ или автоматическое предложение)" }
        assignedTo: { type: string }
    Queue:
      type: object
      required: [items, counts]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QueueItem' }
        counts:
          type: object
          additionalProperties: { type: integer }
    StaffApplication:
      type: object
      required: [application, events, allowedActions]
      properties:
        application: { $ref: '#/components/schemas/Application' }
        scoring: { $ref: '#/components/schemas/ScoringResult' }
        enrichment: { $ref: '#/components/schemas/Enrichment' }
        recommended: { $ref: '#/components/schemas/Offer' }
        purposeVerdict: { type: string, enum: [confirmed, clarify, not_confirmed], description: "Вердикт сотрудника по цели и сумме, если он есть" }
        reasons:
          type: array
          items: { type: string }
        manualCheck: { type: boolean }
        assignedTo: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/TimelineEntry' }
        allowedActions:
          type: array
          items: { type: string, enum: [approve, counter, request_info, reject] }
        version: { type: integer }
    DecisionRequest:
      type: object
      required: [action, version]
      properties:
        action: { type: string, enum: [approve, counter, request_info, reject] }
        comment: { type: string, maxLength: 1000 }
        version: { type: integer }
        offer:
          type: object
          required: [amount, termMonths, rateBp]
          properties:
            amount: { type: integer, format: int64 }
            termMonths: { type: integer }
            rateBp: { type: integer }
    Explanation:
      type: object
      required: [text, source]
      properties:
        text: { type: string }
        source: { type: string, enum: [ai, rules] }
